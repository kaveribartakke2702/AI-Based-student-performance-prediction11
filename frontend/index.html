<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>AI-Based Student Performance Prediction</h1>
        <p>Enter student details to predict academic performance.</p>

        <label>Student Name</label>
        <input type="text" id="studentName" placeholder="Enter student name">

        <label>Study Hours</label>
        <input type="number" id="studyHours" placeholder="Enter study hours">

        <label>Attendance Percentage</label>
        <input type="number" id="attendance" placeholder="Enter attendance">

        <label>Previous Score</label>
        <input type="number" id="previousScore" placeholder="Enter previous score">

        <button onclick="predictPerformance()">Predict Performance</button>

        <div id="loading" class="loading"></div>
        <div id="result" class="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
